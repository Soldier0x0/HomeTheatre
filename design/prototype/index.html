<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Theater — TV UI Prototype (MOCK DATA)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Prototype note: everything below renders MOCK sample data. No server calls. -->
  <nav class="topnav" id="topnav" aria-label="Primary"></nav>

  <header class="hero" id="hero" aria-label="Featured"></header>

  <main id="shelves" aria-label="Library shelves"></main>

  <!-- Detail overlay (MOCK) -->
  <div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-label="Title details">
    <div class="sheet">
      <h2 id="detailTitle"></h2>
      <div class="type-line" id="detailType"></div>
      <div class="meta-chips" id="detailCaps"></div>
      <p class="desc" id="detailDesc" style="margin-top:14px"></p>
      <div class="actions" style="margin-top:8px">
        <button class="pill">▶&nbsp;&nbsp;Play (mock)</button>
        <button class="pill ghost" id="detailClose">Close</button>
      </div>
      <p class="note">Prototype uses mock data. Playback is not implemented yet.</p>
    </div>
  </div>

  <!-- Passwordless profile switcher (confirmed product rule: no PIN/password) -->
  <div class="overlay" id="profileOverlay" role="dialog" aria-modal="true" aria-label="Switch profile">
    <div class="sheet" style="text-align:center">
      <h2>Who's watching?</h2>
      <p class="type-line">Select a profile — no password required.</p>
      <div class="profile-grid" id="profileGrid"></div>
      <p class="note">Press Enter to switch · Escape to cancel · P to reopen</p>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
